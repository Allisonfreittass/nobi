    <div style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 64px; font-weight: 800; letter-spacing: -0.04em; line-height: 0.9">Nobi<span style="color: #FFF1E4">.</span></h1>

  <div style="background: #F7F5F0; border-radius: 32px 32px 0 0; padding: 24px 20px 32px; display: flex; flex-direction: column; gap: 12px">

      <a href="Feed.dc.html" style="height: 56px; border-radius: 18px; background: #141218; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 16px Inter, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="3"></rect><path d="M11 18h2"></path></svg>Continuar com Apple</a>
      <a href="Feed.dc.html" style="height: 56px; border-radius: 18px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E4DDD0; color: #141218; display: flex; align-items: center; justify-content: center; gap: 10px; font: 700 16px Inter, sans-serif"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#141218" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 12h8"></path></svg>Continuar com Google</a>

    <sc-if value="{{showEmail}}" hint-placeholder-val="{{ false }}">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">E-mail
        <input type="email" placeholder="voce@email.com" style="height: 52px; border-radius: 16px; border: none; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E4DDD0; padding: 0 16px; font: 400 16px Inter, sans-serif; color: #141218"></input>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Senha
        <input type="password" placeholder="Sua senha" style="height: 52px; border-radius: 16px; border: none; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #E4DDD0; padding: 0 16px; font: 400 16px Inter, sans-serif; color: #141218"></input>
      </label>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <button onClick="{{toSocial}}" style="height: 44px; border: none; background: transparent; padding: 0; font: 600 14px Inter, sans-serif; color: #4A4752">← Outras opções</button>
        <a href="#" style="height: 44px; display: flex; align-items: center; font: 600 14px Inter, sans-serif; color: #4A4752">Esqueci a senha</a>
      </div>
      <a href="Feed.dc.html" style="height: 56px; border-radius: 18px; background: #FF5B2E; color: #141218; display: flex; align-items: center; justify-content: center; font: 700 16px Inter, sans-serif; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.12)">Entrar</a>

    <p style="margin: 4px 0 0; font-size: 12px; line-height: 1.5; color: #4A4752; text-align: center">Ainda não tem conta? <a href="#" style="font-weight: 700; color: #141218; text-decoration: underline">Criar conta</a><br>Ao continuar, você concorda com os Termos e a Política de Privacidade.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: 'social' }; }
  renderVals() {
    const s = this.state.mode === 'social';
    return {
      showSocial: s, showEmail: !s,
      toEmail: () => this.setState({ mode: 'email' }),
      toSocial: () => this.setState({ mode: 'social' })
    };
  }
}
</script>
</body>
