<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nobi — Editar perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#141218;text-decoration:none}a:hover{color:#141218}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F5F0; color: #141218; font-family: Inter, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 52px 20px 12px">
    <a href="Perfil.dc.html" aria-label="Voltar" style="width: 44px; height: 44px; border-radius: 22px; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E9E5DC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141218" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; font-weight: 700">Editar perfil</h1>
    <a href="Perfil.dc.html" style="height: 44px; padding: 0 16px; border-radius: 22px; background: #141218; color: #FFFFFF; display: flex; align-items: center; font: 700 14px Inter, sans-serif">Salvar</a>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 8px 20px 32px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div style="position: relative; width: 104px; height: 104px">
        <div style="width: 104px; height: 104px; border-radius: 34px; background: #FFF1E4; box-shadow: inset 0 0 0 1px #F0DCC8; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800">R</div>
        <button aria-label="Trocar foto" style="position: absolute; right: -6px; bottom: -6px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #FF5B2E; box-shadow: 0 0 0 4px #F7F5F0; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#141218" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
      </div>
      <span style="font-size: 13px; color: #4A4752">Foto ou avatar do Broto</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 0 #E9E5DC">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nome
        <input type="text" value="Rafa Lima" style="height: 48px; border-radius: 14px; border: none; background: #F7F5F0; padding: 0 14px; font: 500 16px Inter, sans-serif; color: #141218"></input>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">Nome de usuário
        <span style="display: flex; align-items: center; height: 48px; border-radius: 14px; background: #F7F5F0; padding: 0 14px; gap: 2px"><span style="font: 500 16px Inter, sans-serif; color: #6B6872">@</span><input type="text" value="rafalima" style="flex: 1; min-width: 0; height: 46px; border: none; background: transparent; padding: 0; font: 500 16px Inter, sans-serif; color: #141218"></input><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2E7A54" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Disponível" role="img"><path d="m5 12 5 5 9-10"></path></svg></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600">
        <span style="display: flex; justify-content: space-between">Bio <span style="font-weight: 500; color: #6B6872">{{bioLen}}/120</span></span>
        <textarea onInput="{{onBio}}" style="height: 84px; resize: none; border-radius: 14px; border: none; background: #F7F5F0; padding: 12px 14px; font: 400 15px/1.45 Inter, sans-serif; color: #141218">Lendo mais, correndo melhor e terminando o app.</textarea>
      </label>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700">Interesses</span><span style="font-size: 13px; color: #6B6872">aparecem no perfil e ajudam a achar desafios</span></div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{tags}}" as="t" hint-placeholder-count="8">
          <button onClick="{{t.flip}}" aria-pressed="{{t.on}}" style="{{t.s}}">{{t.label}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px; padding: 6px 16px; border-radius: 24px; background: #FFFFFF; box-shadow: 0 1px 0 #E9E5DC">
      <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; gap: 12px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Estatísticas no perfil</span><span style="font-size: 12px; color: #6B6872">sequência, consistência e mapa do mês</span></span>
        <div style="display: flex; padding: 3px; border-radius: 14px; background: #F7F5F0; flex-shrink: 0">
          <sc-for list="{{aud}}" as="a" hint-placeholder-count="2">
            <button onClick="{{a.pick}}" aria-pressed="{{a.on}}" style="{{a.s}}">{{a.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="height: 1px; background: #EEEAE2"></div>
      <a href="Configuracoes.dc.html" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; font-size: 15px; font-weight: 600">Mais em Configurações<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6872" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { bio: 47, picked: { Leitura: true, Corrida: true, 'Inglês': true, 'Projeto pessoal': true }, aud: 'amigos' };
  }
  renderVals() {
    const s = this.state;
    const all = ['Leitura', 'Corrida', 'Inglês', 'Projeto pessoal', 'Musculação', 'Meditação', 'Carreira', 'Hábitos'];
    const tags = all.map((l) => {
      const on = !!s.picked[l];
      return { label: l, on: on,
        flip: () => this.setState({ picked: Object.assign({}, s.picked, { [l]: !on }) }),
        s: 'height: 44px; padding: 0 16px; border-radius: 22px; border: none; font: 600 14px Inter, sans-serif; transition: background 140ms; ' + (on ? 'background: #141218; color: #FFFFFF;' : 'background: #FFFFFF; color: #141218; box-shadow: inset 0 0 0 1px #E9E5DC;') };
    });
    const aud = [['amigos', 'Amigos'], ['publico', 'Público']].map((a) => {
      const on = s.aud === a[0];
      return { label: a[1], on: on, pick: () => this.setState({ aud: a[0] }),
        s: 'height: 40px; padding: 0 12px; border-radius: 11px; border: none; font: 600 13px Inter, sans-serif; color: #141218; ' + (on ? 'background: #FFFFFF; box-shadow: 0 1px 3px rgba(20,18,24,0.12);' : 'background: transparent;') };
    });
    return { tags: tags, aud: aud, bioLen: s.bio, onBio: (e) => this.setState({ bio: e.target.value.length }) };
  }
}
</script>
</body>
</html>
